<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Prépa OFII">
<meta name="theme-color" content="#F4F6FB">
<title>Prépa OFII &amp; TCF A2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F4F6FB;--ink:#172033;--muted:#5A6478;--pri:#2B46C9;--pri-d:#1E3399;--pri-s:#E7ECFF;--line:#E3E8F2;--ok:#1B7A50;--ok-s:#E6F4EC;--ok-d:#14583A;--bad:#C8323A;--bad-s:#FBE9EA;--warm:#FFF4D6;--warm-d:#7A3E06;--rec:#E0473A;--dark:#172033}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;cursor:pointer;-webkit-appearance:none;appearance:none}
#app{max-width:820px;margin:0 auto;padding:calc(28px + env(safe-area-inset-top)) 22px 130px}
@media(min-width:700px){#app{padding-left:48px;padding-right:48px;padding-top:calc(40px + env(safe-area-inset-top))}}
#app.focus{padding-bottom:48px}
nav#nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:8px 16px calc(10px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(4,1fr);z-index:10}
nav#nav .in{display:contents}
nav#nav button{background:none;border:none;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px;font-size:13px;font-weight:600;min-height:58px}
nav#nav button.on{color:var(--pri);font-weight:800}
nav#nav.hide{display:none}
.stack{display:flex;flex-direction:column;gap:20px}
.stack.s{gap:12px}
.card{background:#fff;border-radius:24px;padding:24px 26px}
.row{display:flex;align-items:center;gap:14px}
.row.wrap{flex-wrap:wrap}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
h1{margin:0;font-size:34px;font-weight:800;letter-spacing:-.02em;line-height:1.15}
h2{margin:0;font-size:21px;font-weight:800;line-height:1.3}
h2.q{font-size:26px;letter-spacing:-.01em}
h3{margin:0;font-size:18px;font-weight:800}
p{margin:0;line-height:1.5}
.muted{color:var(--muted)}
.kicker{font-size:13px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--pri)}
.btn{border:none;border-radius:16px;padding:0 22px;min-height:56px;font-size:17px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:10px;background:#fff;color:var(--ink);text-align:center}
.btn.pri{background:var(--pri);color:#fff}
.btn.big{min-height:68px;font-size:19px;font-weight:800;border-radius:20px;width:100%}
.btn.ghost{border:1.5px solid #C9D2E8}
.btn.soft{background:var(--pri-s);color:var(--pri)}
.btn.dark{background:var(--dark);color:#fff}
.btn.light{background:#fff;color:var(--ink)}
.btn.line-w{background:transparent;color:#fff;border:1.5px solid rgba(255,255,255,.5)}
.btn.danger{color:var(--bad);border:1.5px solid #F0C4C7}
.btn.full{width:100%}
.btn:disabled{opacity:.45}
.chip{display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:8px 16px;font-size:14px;font-weight:800;background:var(--pri-s);color:var(--pri)}
.chip.o{background:#FDEBDD;color:#8A3D0B}
.chip.g{background:var(--ok-s);color:var(--ok-d)}
.chip.w{background:#fff;color:var(--muted);font-weight:700}
.back{background:none;border:none;color:var(--pri);font-size:16px;font-weight:700;display:inline-flex;align-items:center;gap:6px;padding:10px 0;min-height:44px}
.hero{background:var(--pri);color:#fff;border-radius:28px;padding:26px;display:flex;flex-direction:column;gap:14px}
.step{border-radius:18px;padding:14px 16px;display:flex;align-items:center;gap:14px;background:rgba(255,255,255,.12);color:#fff;border:none;text-align:left;width:100%;font-size:inherit;min-height:64px}
.step.cur{background:#fff;color:var(--ink)}
.step .n{width:36px;height:36px;border-radius:999px;display:flex;align-items:center;justify-content:center;font-weight:800;flex-shrink:0;border:2px solid rgba(255,255,255,.6)}
.step.cur .n{background:var(--pri-s);color:var(--pri);border:none}
.step.done .n{background:#fff;color:var(--ok);border:none}
.step .t{font-size:17px;font-weight:700;display:block}
.step .s{font-size:14px;color:rgba(255,255,255,.88);display:block;margin-top:2px}
.step.cur .s{color:var(--muted)}
.step .go{margin-left:auto;background:var(--pri);color:#fff;border-radius:12px;padding:10px 16px;font-size:15px;font-weight:700;flex-shrink:0}
.bar{height:10px;background:#E9EDF5;border-radius:999px;overflow:hidden}.bar>i{display:block;height:100%;background:var(--pri);border-radius:999px}
.progress{height:12px;background:var(--line);border-radius:999px;flex:1;overflow:hidden}.progress>i{display:block;height:100%;background:var(--pri);border-radius:999px;transition:width .3s}
.iconbtn{width:48px;height:48px;border-radius:999px;background:#fff;color:var(--ink);border:none;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.opts{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:640px){.opts{grid-template-columns:1fr 1fr}}
.opt{width:100%;text-align:left;min-height:68px;border-radius:18px;border:2px solid var(--line);background:#fff;color:var(--ink);font-size:19px;font-weight:700;padding:12px 18px;display:flex;align-items:center;gap:14px;line-height:1.3}
.opt .l{width:32px;height:32px;border-radius:10px;background:var(--bg);font-size:15px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.opt.ok{border-color:var(--ok);background:var(--ok-s);color:var(--ok-d)}.opt.ok .l{background:var(--ok);color:#fff}
.opt.bad{border-color:var(--bad);background:var(--bad-s);color:#8E1F26}.opt.bad .l{background:var(--bad);color:#fff}
.opt.sm{min-height:56px;font-size:18px;justify-content:center;text-align:center}
.doc{background:#FFFDF6;border:2px solid #EADFC0;border-radius:18px;padding:20px 22px;font-size:18px;line-height:1.55;white-space:pre-line}
.doc .dk{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#7A5C0E;margin-bottom:6px;display:block;white-space:normal}
.fb{border-radius:22px;padding:22px 24px;display:flex;flex-direction:column;gap:10px}
.fb.ok{background:var(--ok-s);color:#1F3B2E}.fb.bad{background:var(--bad-s);color:#5A1A1F}
.fb .h{font-size:20px;font-weight:800}
.fb .lnk{background:none;border:none;padding:6px 0;font-size:16px;font-weight:700;color:inherit;text-decoration:underline;text-align:left;align-self:flex-start;min-height:44px}
.player{display:flex;flex-direction:column;align-items:center;gap:20px}
.playbig{width:112px;height:112px;border-radius:999px;border:none;background:var(--pri);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 14px var(--pri-s)}
.seg{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.seg button{border:none;border-radius:14px;padding:10px 18px;font-size:16px;font-weight:700;background:var(--bg);color:var(--ink);min-height:48px}
.seg button.on{background:var(--dark);color:#fff}
textarea,input[type=text],input[type=date]{font-family:inherit;font-size:18px;line-height:1.5;color:var(--ink);border:2px solid var(--line);border-radius:16px;padding:14px 16px;background:#FAFBFD;width:100%;-webkit-appearance:none;appearance:none}
input[type=date]{min-height:56px}
textarea{resize:vertical;min-height:130px}
textarea:focus,input:focus{outline:none;border-color:var(--pri)}
:focus-visible{outline:3px solid #7F95F0;outline-offset:2px}
.tip{display:flex;gap:10px;align-items:flex-start;background:var(--warm);color:var(--warm-d);border-radius:14px;padding:12px 14px;font-size:15px;font-weight:600;line-height:1.45}
.tip svg{flex-shrink:0;margin-top:1px}
.recbox{background:var(--dark);color:#fff;border-radius:28px;padding:24px;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.recbtn{width:96px;height:96px;border-radius:999px;border:none;background:var(--rec);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 12px rgba(224,71,58,.25)}
.recbtn.on{animation:pulse 1.2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(224,71,58,.55)}100%{box-shadow:0 0 0 24px rgba(224,71,58,0)}}
.rect{font-size:24px;font-weight:800}
.recbox small{font-size:15px;color:#C9D2E8}
.model{background:var(--pri-s);border-radius:18px;padding:18px 20px;font-size:17px;line-height:1.6;color:#1B2A6B;display:flex;gap:14px;align-items:flex-start}
.ex{display:flex;align-items:center;gap:14px;padding:10px 0;border-bottom:1px solid #EEF1F7;font-size:18px;font-weight:600;line-height:1.4}
.ex:last-child{border-bottom:none}
.ibtn{width:44px;height:44px;border-radius:999px;border:none;background:var(--pri-s);color:var(--pri);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ibtn.pri{background:var(--pri);color:#fff}
.num{width:28px;height:28px;border-radius:10px;background:var(--pri-s);color:var(--pri);font-weight:800;font-size:14px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ess{display:flex;gap:14px;align-items:flex-start;font-size:17px;line-height:1.5}
.retenir{background:var(--dark);color:#fff;border-radius:24px;padding:22px 26px;display:flex;gap:16px;align-items:center}
.retenir .kicker{color:#F2A93B}
.retenir p{font-size:20px;font-weight:700;line-height:1.45;margin-top:6px}
.grid2{display:grid;grid-template-columns:1fr;gap:16px}
@media(min-width:640px){.grid2{grid-template-columns:1fr 1fr}}
.grid4{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:640px){.grid4{grid-template-columns:repeat(4,1fr)}}
.grid3{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:640px){.grid3{grid-template-columns:repeat(3,1fr)}}
.stat{background:#fff;border-radius:20px;padding:16px 18px;display:flex;flex-direction:column;gap:2px}
.stat span{font-size:14px;font-weight:600;color:var(--muted)}.stat b{font-size:26px;font-weight:800}
.fcard{background:#fff;border:none;border-radius:20px;padding:16px 18px;text-align:left;display:flex;align-items:center;gap:14px;width:100%;color:var(--ink);font-size:inherit;min-height:72px}
.fcard .fn{width:44px;height:44px;border-radius:14px;background:var(--pri-s);color:var(--pri);font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.fcard.done .fn{background:var(--ok-s);color:var(--ok)}
.fcard b{display:block;font-size:17px}.fcard small{display:block;color:var(--muted);font-size:14px;margin-top:2px}
.helpers{display:flex;flex-wrap:wrap;gap:10px}
.helpers span{background:var(--pri-s);color:var(--pri-d);border-radius:12px;padding:10px 14px;font-size:16px;font-weight:700}
.urg{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.urg div{border:2px solid var(--line);border-radius:14px;padding:10px 6px;display:flex;flex-direction:column;align-items:center}
.urg b{font-size:22px;color:var(--bad)}.urg span{font-size:13px;font-weight:600;color:var(--muted)}
.scene{background:#fff;border-radius:24px;padding:12px}
.scene svg{width:100%;height:auto;display:block;border-radius:16px}
#toast{position:fixed;left:16px;right:16px;margin:0 auto;bottom:calc(104px + env(safe-area-inset-bottom));transform:translateY(20px);background:var(--dark);color:#fff;padding:14px 20px;border-radius:16px;font-weight:600;font-size:16px;opacity:0;pointer-events:none;transition:.25s;width:fit-content;max-width:560px;z-index:50;text-align:center;line-height:1.4}
#toast.on{opacity:1;transform:translateY(0)}
@media(max-width:560px){.step .go{display:none}h1{font-size:30px}}
.modal{position:fixed;inset:0;background:rgba(23,32,51,.55);display:flex;align-items:center;justify-content:center;padding:20px;z-index:40}
.modal .card{max-width:680px;width:100%;max-height:86vh;overflow:auto}
.streak{display:flex;gap:8px;flex-wrap:wrap}.streak i{width:32px;height:32px;border-radius:10px;background:#FBE3B0}.streak i.on{background:#F2A93B}
.countdown{background:var(--dark);color:#fff;border-radius:22px;padding:14px 20px;display:flex;flex-direction:column;align-items:center;min-width:112px;text-align:center}
.countdown small{font-size:13px;color:#C9D2E8;font-weight:600}.countdown b{font-size:32px;font-weight:800;letter-spacing:-.02em}
.hist{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border:none;border-bottom:1px solid #EEF1F7;font-size:16px;background:none;width:100%;color:var(--ink);text-align:left;min-height:52px}
.hist:last-child{border-bottom:none}
.lbl{font-size:16px;font-weight:800;display:block;margin-bottom:8px}
.pdfthumb{width:150px;height:196px;background:#fff;border-radius:10px;padding:13px;display:flex;flex-direction:column;gap:6px;flex-shrink:0;transform:rotate(-3deg)}
.pdfthumb b{font-size:8px;font-weight:800;color:var(--pri)}.pdfthumb b.k{color:var(--ink);margin-top:5px}
.pdfthumb i{display:block;height:5px;background:#DCE3F2;border-radius:3px}
.export{background:var(--dark);color:#fff;border-radius:28px;padding:26px;display:flex;gap:24px;align-items:center}
.export p{color:#C9D2E8;font-size:16px}
@media(max-width:560px){.pdfthumb{display:none}.export{padding:22px}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.part{background:#fff;border-radius:18px;padding:14px 18px;font-weight:700;display:flex;justify-content:space-between;align-items:center}
</style>
</head>

const T = {2:"vingt",3:"trente",4:"quarante",5:"cinquante",6:"soixante"};
function nfr(n){
 if(n<20) return U[n];
 if(n<70){ const t=Math.floor(n/10), u=n%10; return T[t]+(u===0?"":(u===1?" et un":"-"+U[u])); }
 if(n<80) return n===71?"soixante et onze":"soixante-"+U[n-60];
 if(n===80) return "quatre-vingts";
 return "quatre-vingt-"+U[n-80];
}
const MOIS = ["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];
function rot(arr,k){ const r=arr.slice(); for(let i=0;i<k%r.length;i++) r.push(r.shift()); return r; }
function placeOpts(good, bads, k){ const o=[good].concat(bads.slice(0,2)); const r=rot(o,k); return {o:r, a:r.indexOf(good)}; }
function h2s(h,m){ return h+" h "+String(m).padStart(2,"0"); }
function h2w(h,m){ return (h===1?"une heure":nfr(h)+" heures")+(m?" "+nfr(m):""); }

[

 ["o3",2,"Parlez-moi de votre famille.","Je suis mariée. Mon mari s'appelle Karim, il est cuisinier. Nous avons deux enfants : une fille de six ans et un fils de trois ans. Mes parents habitent au Maroc."],

 ["o5",4,"Quel travail voulez-vous faire en France ?","Je voudrais travailler dans la couture ou dans la vente. D'abord, je vais apprendre le français, puis je vais chercher une formation."],

 ["o10",10,"Comment vous déplacez-vous en ville ?","En ville, je prends le tram ou le bus. J'ai un abonnement. Parfois, je marche parce que l'école est près de chez moi."],
 ["o11",17,"Quand êtes-vous arrivée en France ?","Je suis arrivée en France en mars 2025. Je suis venue en avion avec mes enfants."],
 ["o12",18,"Quels sont vos projets en France ?","Je vais continuer à apprendre le français. Après, je vais chercher un travail et je voudrais passer mon permis de conduire."],
 ["o13",14,"Quelles langues parlez-vous ?","Je parle arabe, c'est ma langue maternelle. Je parle aussi un peu français et un peu anglais."],
 ["o14",12,"Avez-vous déjà fait des démarches à la mairie ou à la CAF ? Racontez.","Oui, je suis allée à la mairie pour inscrire mon fils à l'école. J'ai aussi fait une demande à la CAF pour l'aide au logement."],
 ["o15",11,"Que faites-vous quand vous êtes malade ?","Quand je suis malade, je prends rendez-vous chez le médecin. Je donne ma carte Vitale. Après, je vais à la pharmacie avec l'ordonnance."],
 ["o16",7,"Quels numéros appelez-vous en cas d'urgence ?","Pour un problème médical, j'appelle le 15. Pour la police, le 17. Pour un incendie, le 18. Et le 112, c'est le numéro européen."],
 ["o17",20,"D'où venez-vous ? Parlez de votre ville d'origine.","Je viens de Fès, au Maroc. C'est une grande ville, très ancienne. Il y a une belle médina et beaucoup de marchés."],
 ["o18",17,"Qu'est-ce que vous avez fait hier ?","Hier, je suis allée au cours de français. Ensuite, j'ai fait les courses et j'ai préparé le dîner. Le soir, j'ai regardé la télévision."],
 ["o19",10,"Où faites-vous vos courses ? Qu'est-ce que vous achetez ?","Je fais mes courses au supermarché et au marché. J'achète des fruits, des légumes, du pain et de la viande."],

 ["o21",16,"Vous êtes perdue dans la rue. Demandez votre chemin à un passant.","Excusez-moi Monsieur, je cherche la gare. Est-ce que c'est loin ? Je dois aller à droite ou à gauche ?"],
 ["o22",21,"Vous n'avez pas compris une question. Que dites-vous ?","Pardon, je n'ai pas bien compris. Pouvez-vous répéter plus lentement, s'il vous plaît ?"],
 ["o23",11,"Téléphonez au médecin pour prendre rendez-vous.","Bonjour, je voudrais prendre rendez-vous avec le docteur Martin, s'il vous plaît. J'ai de la fièvre depuis deux jours. Est-ce que c'est possible demain matin ?"],

 ["o25",5,"Quel est votre plat préféré ? Pourquoi ?","Mon plat préféré, c'est le couscous. Je l'aime parce que c'est le plat de la famille, on le mange le vendredi."],
 ["o26",3,"Qu'est-ce que vous aimez en France ? Qu'est-ce qui est difficile ?","J'aime la France parce que c'est calme et il y a beaucoup de parcs. C'est difficile de parler français et de trouver un travail."],

/* ================= VOIX (synthèse vocale) ================= */
let VOICES = [];
function loadVoices(){ try{ const all = speechSynthesis.getVoices() || []; const fr = all.filter(v => /^fr/i.test(v.lang));
 const score = v => (/premium|enhanced|amélioré|natural|neural/i.test(v.name)?10:0) + (/fr[-_]FR/i.test(v.lang)?5:0) + (/amélie|thomas|audrey|aurélie|google/i.test(v.name)?3:0);
 VOICES = fr.sort((a,b)=>score(b)-score(a)); }catch(e){ VOICES = []; } }
try{ if("speechSynthesis" in window){ loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; } }catch(e){}
function say(text, slow){
 if(!("speechSynthesis" in window)){ toast("La lecture à voix haute n'est pas disponible sur cet appareil."); return; }
 try{ speechSynthesis.cancel(); if(!VOICES.length) loadVoices();
  const rate = (slow===undefined ? S.slow : slow) ? 0.72 : 0.95;
  const lines = String(text).split("\n").map(l=>l.trim()).filter(Boolean);
  let alt = 0;
  lines.forEach(line => {
   const dia = /^[—–-]\s*/.test(line); const clean = line.replace(/^[—–-]\s*/,"").replace(/…/g,"...");
   const u = new SpeechSynthesisUtterance(clean); u.lang = "fr-FR"; u.rate = rate;
   if(VOICES.length){ u.voice = (dia && VOICES.length>1) ? VOICES[alt % 2] : VOICES[0]; }
   if(dia) alt++;
   speechSynthesis.speak(u);
  });
 }catch(e){ toast("Impossible de lire le texte."); }
}

/* ================= ENREGISTREMENT & DICTÉE ================= */
let REC = null; const RECS = {};
function setAns(id, patch){ if(!S.cur) return; S.cur.ans[id] = Object.assign(S.cur.ans[id]||{}, patch); save(); }
async function startRec(id){
 if(REC){ stopRec(); return; }
 const ta = document.querySelector('textarea[data-ans="'+id+'"]');
 const r = {id, chunks:[], t0:Date.now(), base: ta ? ta.value.trim() : "", mr:null, sr:null, stream:null};
 let ok = false;
 try{
  if(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.MediaRecorder){
   const st = await navigator.mediaDevices.getUserMedia({audio:true});
   const mr = new MediaRecorder(st); r.mr = mr; r.stream = st;
   mr.ondataavailable = e => { if(e.data && e.data.size) r.chunks.push(e.data); };
   mr.onstop = () => { try{ const blob = new Blob(r.chunks, {type: mr.mimeType || "audio/mp4"}); if(RECS[id]) URL.revokeObjectURL(RECS[id]); RECS[id] = URL.createObjectURL(blob); }catch(e){} try{ st.getTracks().forEach(t=>t.stop()); }catch(e){} if(V.view==="session") render(false); };
   mr.start(); ok = true;
  }
 }catch(e){}
 const SRC = window.SpeechRecognition || window.webkitSpeechRecognition;
 if(SRC){ try{
  const sr = new SRC(); sr.lang = "fr-FR"; sr.continuous = true; sr.interimResults = true;
  sr.onresult = ev => { let txt = ""; for(let k=0;k<ev.results.length;k++) txt += ev.results[k][0].transcript; txt = ((r.base ? r.base+" " : "") + txt.trim()).trim();
   const t = document.querySelector('textarea[data-ans="'+id+'"]'); if(t) t.value = txt; setAns(id, {text: txt}); };
  sr.onerror = () => {}; sr.start(); r.sr = sr; ok = true;
 }catch(e){} }
 if(!ok){ toast("Micro indisponible ici. Touche la case de texte, puis la touche micro du clavier pour dicter."); if(ta) ta.focus(); return; }
 REC = r;
 r.timer = setInterval(() => { const s = Math.floor((Date.now()-r.t0)/1000); const el = $("#rectime"); if(el) el.textContent = mmss(Math.min(s,60))+" / 1:00"; if(s>=60) stopRec(); }, 250);
 render(false);
}
function stopRec(){ const r = REC; if(!r) return; REC = null; clearInterval(r.timer);
 try{ if(r.mr && r.mr.state !== "inactive") r.mr.stop(); }catch(e){} try{ if(r.sr) r.sr.stop(); }catch(e){}
 render(false); }

/* ================= PROGRAMME & SÉLECTION ================= */
function fichesForDay(d){ if(d<=PROGRAM.length) return PROGRAM[d-1]; return weakFiches(3, d); }
function weakFiches(n, d){ const cnt = {}; Object.keys(S.wrong).forEach(id => { const it = BY[id]; if(it) cnt[it.f] = (cnt[it.f]||0) + S.wrong[id]; });
 const r = Object.keys(cnt).map(Number).sort((a,b)=>cnt[b]-cnt[a]).slice(0,n);
 let k = 0; while(r.length < n){ const f = ((d||S.day)*3 + k) % FICHES.length + 1; if(!r.includes(f)) r.push(f); k++; }
 return r; }
function pick(fn, n, fset, used, pref){
 const pool = BANK.filter(it => fn(it) && !used.has(it.id));
 pool.forEach(it => { it._w = Math.random()*2 + (S.seen[it.id]?0:2) + (fset.has(it.f)?3:0) + (S.wrong[it.id]?4:0) + (pref && pref.includes(it.id) ? 100 : 0); });
 pool.sort((a,b) => b._w - a._w);
 const r = pool.slice(0, n); r.forEach(it => used.add(it.id)); return r.map(it => it.id);
}
const isQ = s => it => it.t==="qcm" && it.s===s;
function newSession(mode){
 const used = new Set();
 if(mode === "sim"){
  const fset = new Set(weakFiches(4));
  const ecrit = [].concat(pick(isQ("CE"),4,fset,used), pick(isQ("EE"),3,fset,used), pick(it=>it.t==="write",1,fset,used));
  const oral = [].concat(pick(it=>it.t==="speak",5,new Set([1,3,2]),used,["o1","o2","o3"]), pick(it=>it.t==="image",2,fset,used));
  S.cur = {mode, day:S.day, items: ecrit.concat(oral), split: ecrit.length, i:0, ans:{}, t0:Date.now()};
 } else {
  const fset = new Set(fichesForDay(S.day));
  const items = [].concat(pick(isQ("CE"),4,fset,used), pick(isQ("CO"),4,fset,used), pick(isQ("EE"),2,fset,used), pick(it=>it.t==="write",1,fset,used), pick(it=>it.t==="speak",3,fset,used), pick(it=>it.t==="image",1,fset,used));
  S.cur = {mode:"daily", day:S.day, items, i:0, ans:{}, t0:Date.now()};
 }
 V.model = {}; save();
}

/* ================= STATISTIQUES ================= */
function repStats(rep){
 const q = {CE:[0,0], CO:[0,0], EE:[0,0]}, errors = [], writes = [], orals = [], fset = new Set();
 rep.items.forEach(({id, a}) => { const it = BY[id]; if(!it) return;
  if(it.t === "qcm"){ q[it.s][1]++; if(a && a.ok) q[it.s][0]++; else { errors.push({it, a}); fset.add(it.f); } }
  else if(it.t === "write") writes.push({it, text: a && a.text ? a.text.trim() : ""});
  else orals.push({it, text: a && a.text ? a.text.trim() : ""});
 });
 const c = q.CE[0]+q.CO[0]+q.EE[0], t = q.CE[1]+q.CO[1]+q.EE[1];
 return {q, c, t, errors, writes, orals, fiches: [...fset].sort((a,b)=>a-b)};
}
function totals(){ const g = {CE:[0,0], CO:[0,0], EE:[0,0]}; let orals = 0;
 S.hist.forEach(r => { const st = repStats(r); ["CE","CO","EE"].forEach(k => { g[k][0]+=st.q[k][0]; g[k][1]+=st.q[k][1]; }); orals += st.orals.filter(o=>o.text).length; });
 return {g, orals}; }
function streak(){ const days = new Set(S.hist.map(h => h.date)); let d = new Date(); if(!days.has(todayISO(d))) d.setDate(d.getDate()-1); let n = 0; while(days.has(todayISO(d))){ n++; d.setDate(d.getDate()-1); } return n; }
function doneToday(){ return S.hist.some(h => h.mode==="daily" && h.date===todayISO()); }

function qQcm(it, a){

 P("Séances terminées : " + S.hist.length + ".");

 if(hh) P("Historique des scores QCM : " + hh);
 const wf = weakFiches(3).map(n => "fiche " + n + " (" + FBY[n].t + ")").join(", ");
 if(Object.keys(S.wrong).length) P("Fiches avec le plus d'erreurs (tout l'historique) : " + wf + ".");

 });
 P("5. Expression écrite – à corriger", "h2");
 if(!st.writes.length) P("Pas d'expression écrite dans cette séance.");
 st.writes.forEach(({it, text}, i) => { P("Consigne " + (i+1) + " : " + it.q, "b"); P(text ? "Son texte : « " + text + " »" : "(pas de réponse)"); });
 P("6. Expression orale – transcriptions à corriger", "h2");
 if(!st.orals.length) P("Pas d'expression orale dans cette séance.");
 st.orals.forEach(({it, text}, i) => { P("Question " + (i+1) + (it.t==="image" ? " (description d'image : " + SCLBL[it.sc] + ")" : "") + " : " + it.q, "b"); P(text ? "Sa réponse : « " + text + " »" : "(pas de réponse)"); });

 P(st.fiches.length ? st.fiches.map(n => "Fiche " + n + " – " + FBY[n].t).join(" ; ") : "Aucune en particulier.");

}

/* --- Mini générateur PDF (Helvetica, WinAnsi) --- */
const CP = {0x20AC:0x80,0x201A:0x82,0x201E:0x84,0x2026:0x85,0x2020:0x86,0x2021:0x87,0x2030:0x89,0x0160:0x8A,0x2039:0x8B,0x0152:0x8C,0x017D:0x8E,0x2018:0x91,0x2019:0x92,0x201C:0x93,0x201D:0x94,0x2022:0x95,0x2013:0x96,0x2014:0x97,0x2122:0x99,0x0161:0x9A,0x203A:0x9B,0x0153:0x9C,0x017E:0x9E,0x0178:0x9F};
function pdfStr(s){ let o = ""; for(const ch of String(s).normalize("NFC")){ let c = ch.codePointAt(0); if(c===0x202F||c===0xA0||c===0x2009) c = 0x20; if(c===0x2192) { o += "->"; continue; }
 if(!(c<128 || (c>=0xA0 && c<=0xFF))) c = CP[c] || 63; const x = String.fromCharCode(c); o += (x==="("||x===")"||x==="\\") ? "\\"+x : x; } return o; }
const CW = {" ":278,"!":278,'"':355,"'":191,"(":333,")":333,",":278,"-":333,".":278,"/":278,":":278,";":278,"?":556,"«":556,"»":556,"’":222,"…":1000,"–":556,"—":1000,"€":556,"%":889,"&":667,"+":584,"=":584,"I":278,"J":500,"M":833,"W":944,"m":833,"w":722,"f":278,"i":222,"j":222,"l":222,"r":333,"t":278,"c":500,"k":500,"s":500,"v":500,"x":500,"y":500,"z":500,"·":278,"→":1000,"œ":944};
function cw(ch){ if(CW[ch]) return CW[ch]; const b = ch.normalize("NFD")[0]; if(CW[b]) return CW[b]; if(/[0-9]/.test(b)) return 556; if(/[A-Z]/.test(b)) return 700; if(/[a-z]/.test(b)) return 556; return 600; }
function tw(s, size, bold){ let w = 0; for(const ch of s) w += cw(ch); return w*size/1000*(bold?1.08:1); }
function wrapLine(s, size, bold, max){ const out = []; let cur = ""; s.split(/ +/).forEach(w => { const t = cur ? cur+" "+w : w; if(cur && tw(t,size,bold) > max){ out.push(cur); cur = w; } else cur = t; }); if(cur) out.push(cur); return out.length ? out : [""]; }
function makePdf(blocks){
 const PW = 595, PH = 842, M = 50, MAXW = PW - 2*M; const pages = []; let ops = [], y = PH - 60;
 const sty = {h1:{f:"F2",z:17,c:"0.169 0.275 0.788",sb:0,sa:6}, h2:{f:"F2",z:12.5,c:"0.169 0.275 0.788",sb:14,sa:4}, b:{f:"F2",z:10.5,c:"0.09 0.125 0.2",sb:6,sa:1}, p:{f:"F1",z:10.5,c:"0.09 0.125 0.2",sb:2,sa:1}, small:{f:"F1",z:9,c:"0.353 0.392 0.471",sb:2,sa:1}};
 const newPage = () => { pages.push(ops); ops = []; y = PH - 60; };
 blocks.forEach(bl => { const s = sty[bl.s] || sty.p, lh = s.z*1.42; y -= s.sb;
  bl.t.split("\n").forEach(par => wrapLine(par, s.z, s.f==="F2", MAXW).forEach(line => {
   if(y - lh < 56) newPage();
   y -= lh; ops.push(`BT /${s.f} ${s.z} Tf ${s.c} rg ${M} ${y.toFixed(1)} Td (${pdfStr(line)}) Tj ET`);
  }));
  if(bl.s==="h1"){ y -= 6; ops.push(`0.169 0.275 0.788 RG 1.2 w ${M} ${y.toFixed(1)} m ${PW-M} ${y.toFixed(1)} l S`); y -= 4; }
  y -= s.sa; });
 pages.push(ops);
 const N = pages.length, objs = [];
 objs[1] = "<< /Type /Catalog /Pages 2 0 R >>";
 objs[3] = "<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>";
 objs[4] = "<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>";
 const kids = [];
 pages.forEach((p,k) => { const pid = 5 + k*2, cid = pid + 1; kids.push(pid + " 0 R");
  const foot = `BT /F1 8.5 Tf 0.353 0.392 0.471 rg ${M} 30 Td (${pdfStr("Prépa OFII & TCF A2 – page " + (k+1) + "/" + N)}) Tj ET`;
  const stream = p.concat([foot]).join("\n");
  objs[pid] = `<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${PW} ${PH}] /Resources << /Font << /F1 3 0 R /F2 4 0 R >> >> /Contents ${cid} 0 R >>`;
  objs[cid] = `<< /Length ${stream.length} >>\nstream\n${stream}\nendstream`; });
 objs[2] = `<< /Type /Pages /Kids [${kids.join(" ")}] /Count ${N} >>`;
 let out = "%PDF-1.4\n%\xE2\xE3\xCF\xD3\n"; const offs = [];
 for(let i=1;i<objs.length;i++){ offs[i] = out.length; out += i + " 0 obj\n" + objs[i] + "\nendobj\n"; }
 const xref = out.length;
 out += "xref\n0 " + objs.length + "\n0000000000 65535 f \n";
 for(let i=1;i<objs.length;i++) out += String(offs[i]).padStart(10,"0") + " 00000 n \n";
 out += "trailer\n<< /Size " + objs.length + " /Root 1 0 R >>\nstartxref\n" + xref + "\n%%EOF";
 const bytes = new Uint8Array(out.length); for(let i=0;i<out.length;i++) bytes[i] = out.charCodeAt(i) & 255; return bytes;
}

/* --- Livrer un fichier : Claude (si dans un artefact) → partage iPad → téléchargement --- */
let DL;
async function getDL(){ if(DL !== undefined) return DL; DL = null;
 try{ if(window.claude && typeof window.claude.use === "function"){ DL = await Promise.race([window.claude.use("downloads"), new Promise(r => setTimeout(() => r(null), 4000))]); } }catch(e){ DL = null; }
 return DL; }
async function deliver(name, data, mime){
 const blob = new Blob([data], {type: mime});
 const dl = await getDL();
 if(dl){ try{ await dl.save({filename: name, data: blob}); toast("Fichier enregistré."); return; }catch(e){ if(e && e.code === "declined"){ toast("Enregistrement annulé."); return; } } }
 try{ const file = new File([blob], name, {type: mime});
  if(navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file], title: name}); return; } }
 catch(e){ if(e && e.name === "AbortError") return; }
 try{ const url = URL.createObjectURL(blob); const a = document.createElement("a"); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 30000);
  toast("Fichier prêt. Si rien ne s'ouvre, utilise « Copier le texte du bilan »."); }
 catch(e){ toast("Export impossible ici : utilise « Copier le texte du bilan »."); }
}
function copyText(text){
 const fallback = () => { const m = document.createElement("div"); m.className = "modal"; m.innerHTML = `<div class="card stack"><h2>Copier le bilan</h2><p class="muted">Sélectionne tout le texte, copie-le, puis colle-le dans une conversation avec Claude.</p><textarea readonly rows="12">${esc(text)}</textarea><button type="button" class="btn pri" data-a="closeModal">Fermer</button></div>`; document.body.appendChild(m); const t = m.querySelector("textarea"); t.focus(); t.select(); };
 try{ if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(text).then(() => toast("Bilan copié : colle-le dans une conversation avec Claude."), fallback); return; } }catch(e){}
 fallback();
}

/* ================= ACTIONS ================= */
function stopAudio(){ try{ speechSynthesis.cancel(); }catch(e){} if(REC) stopRec(); }
function go(view, extra){ stopAudio(); V.view = view; Object.assign(V, extra||{}); render(); }
function finish(){
 const c = S.cur; const rep = {mode:c.mode, day:c.day, date:todayISO(), dur:Math.max(1, Math.round((Date.now()-c.t0)/60000)), items:c.items.map(id => ({id, a:c.ans[id]||null}))};
 S.hist.push(rep); if(S.hist.length > 120) S.hist.shift();
 if(c.mode === "daily") S.day++;
 S.cur = null; save(); go("report", {rep});
}
function readSettings(){ const d = $("#setDate"), l = $("#setLang"); if(d) S.testDate = d.value || ""; if(l) S.lang = l.value.trim(); save(); }
const ACT = {
 tab(v){ go(v === "train" && S.cur ? "train" : v); },
 onbDone(){ readSettings(); S.onb = true; save(); go("home"); },
 openFiche(v){ V.from = V.view==="fiche" ? V.from : V.view; go("fiche", {fiche:+v}); },
 back(){ go(V.from==="fiche" ? "fiches" : (V.from || "fiches")); },
 ficheDone(v){ S.fdone[+v] = Date.now(); save(); toast("Fiche terminée ✓"); ACT.back(); },
 fq(v){ const [n,i,j] = v.split(":").map(Number); V.fq[n+":"+i] = j; render(false); },
 say(v,b){ say(b.dataset.say); },
 sayItem(){ const it = BY[S.cur.items[S.cur.i]]; if(it && it.au) say(it.au); },
 setSlow(v){ S.slow = v === "1"; save(); render(false); },
 toggleSlow(){ S.slow = !S.slow; save(); render(false); },
 startDaily(){ if(S.cur && S.cur.mode === "daily"){ go("session"); return; } if(S.cur && S.cur.mode === "sim"){ toast("Une simulation est en cours : on la reprend."); go("session"); return; } newSession("daily"); go("session"); },
 startSim(){ if(S.cur){ toast("Termine d'abord la séance en cours."); go("session"); return; } newSession("sim"); go("session"); },
 resume(){ go("session"); },
 quit(){ toast("Séance gardée : tu pourras la reprendre."); go("home"); },
 ans(v){ const c = S.cur, id = c.items[c.i], it = BY[id]; if(c.ans[id] && c.ans[id].choice !== undefined) return; const j = +v, ok = j === it.a;
  c.ans[id] = {choice:j, ok}; S.seen[id] = 1; if(ok){ if(S.wrong[id]){ S.wrong[id]--; if(S.wrong[id] <= 0) delete S.wrong[id]; } } else S.wrong[id] = (S.wrong[id]||0) + 1;
  save(); render(false); },
 next(){ stopAudio(); const c = S.cur; c.i++; save(); if(c.i >= c.items.length) finish(); else render(); },
 validate(){ const c = S.cur, id = c.items[c.i]; const ta = document.querySelector('textarea[data-ans="'+id+'"]'); stopAudio();
  setAns(id, {text: ta ? ta.value : "", done:true}); S.seen[id] = 1; save(); ACT.next(); },
 toggleModel(){ const id = S.cur.items[S.cur.i]; V.model[id] = !V.model[id]; render(false); },
 rec(){ startRec(S.cur.items[S.cur.i]); },
 playRec(){ const u = RECS[S.cur.items[S.cur.i]]; if(u){ try{ const au = new Audio(u); au.play().catch(() => toast("Lecture impossible.")); }catch(e){} } },
 clearAns(){ const id = S.cur.items[S.cur.i]; if(REC) stopRec(); setAns(id, {text:""}); if(RECS[id]){ URL.revokeObjectURL(RECS[id]); delete RECS[id]; } render(false); },
 openRep(v){ go("report", {rep: S.hist[+v]}); },
 exportPdf(v){ const rep = v!==undefined && v!=="" ? S.hist[+v] : (V.view==="report" ? V.rep : S.hist[S.hist.length-1]); if(!rep) return;
  readSettings(); const name = "bilan-" + (rep.mode==="sim" ? "simulation" : "jour-" + rep.day) + "-" + rep.date + ".pdf";
  try{ deliver(name, makePdf(reportBlocks(rep)), "application/pdf"); }catch(e){ toast("Erreur PDF : utilise « Copier le texte »."); } },
 copyRep(v){ const rep = v!==undefined && v!=="" ? S.hist[+v] : (V.view==="report" ? V.rep : S.hist[S.hist.length-1]); if(rep){ readSettings(); copyText(reportText(rep)); } },
 closeModal(v,b){ const m = b.closest(".modal"); if(m) m.remove(); },
 backup(){ readSettings(); const o = clone(S); deliver("prepa-ofii-sauvegarde-" + todayISO() + ".json", JSON.stringify(o), "application/json"); },
 restore(){ $("#restoreInput").click(); },
 reset(){ if(!V.confirmReset){ V.confirmReset = true; render(false); setTimeout(() => { V.confirmReset = false; }, 6000); return; }
  V.confirmReset = false; S = clone(DEF); S.onb = true; save(); toast("Progression effacée."); go("home"); }
};
document.addEventListener("click", e => { const b = e.target.closest("[data-a]"); if(!b || b.disabled) return; const f = ACT[b.dataset.a]; if(f){ e.preventDefault(); f(b.dataset.v, b, e); } });
document.addEventListener("input", e => { const t = e.target; if(t.dataset && t.dataset.ans) setAns(t.dataset.ans, {text: t.value}); });
document.addEventListener("change", e => { const t = e.target; if(t.id === "setDate" || t.id === "setLang"){ readSettings(); if(V.view !== "onboard") toast("Réglage enregistré."); } });
$("#restoreInput").addEventListener("change", e => { const f = e.target.files && e.target.files[0]; if(!f) return; const r = new FileReader();
 r.onload = () => { try{ const o = JSON.parse(r.result); if(!o || !o.v || !Array.isArray(o.hist)) throw 0; S = Object.assign(clone(DEF), o); S.onb = true; save(); toast("Progression restaurée ✓"); go("home"); }catch(err){ toast("Ce fichier n'est pas une sauvegarde valide."); } };
 r.readAsText(f); e.target.value = ""; });
setInterval(() => { if(V.view === "session" && S.cur && S.cur.mode === "sim"){ const el = $("#simt"); if(el) el.textContent = "Partie écrite · " + mmss(Math.floor((Date.now()-S.cur.t0)/1000)) + " / 20:00"; } }, 1000);
render();
</script>
